<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tree</title>
    <style>
        /* CSS styles for the tree structure */
        .tree-container {
            display: flex;
            justify-content: center;
        }

        .tree,
        .tree ul,
        .tree li {
            list-style: none;
            margin: 0;
            padding: 0;
            position: relative;
        }

        .tree {
            text-align: center;
        }

        .tree,
        .tree ul {
            display: table;
        }

        .tree ul {
            width: 100%;
        }

        .tree li {
            display: table-cell;
            padding: 0.5em 0;
            vertical-align: top;
        }

        .tree li:before {
            outline: solid 1px #666;
            content: "";
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
        }

        .tree li:first-child:before {
            left: 50%;
        }

        .tree li:last-child:before {
            right: 50%;
        }

        .tree code,
        .tree span {
            border: solid 0.1em #666;
            border-radius: 0.2em;
            background: #ccfafa;
            display: inline-block;
            margin: 0 0.2em 0.5em;
            padding: 1.2em 1.5em;
            position: relative;
        }

        .tree ul:before,
        .tree code:before,
        .tree span:before {
            outline: solid 1px #666;
            content: "";
            height: 0.5em;
            left: 50%;
            position: absolute;
        }

        .tree ul:before {
            top: -0.5em;
        }

        .tree code:before,
        .tree span:before {
            top: -0.55em;
        }

        .tree > li {
            margin-top: 0;
        }

        .tree > li:before,
        .tree > li:after,
        .tree > li > code:before,
        .tree > li > span:before {
            outline: none;
        }

        /* CSS styles for buttons */
        .btn {
            padding: 0.8em;
            margin-top: 0.5em;
            margin-right: 0.5em;
            font-weight: 900;
            border: 0.5px solid #9f9e9e;
            cursor: pointer;
            color: #000;
            border-radius: 5px;
            background-color: aliceblue;
        }
    </style>
</head>
<body>
<div class="tree-container">
    <div class="">
        <!-- Tree structure -->
        <div id="heapSortBtn" class="btn">Perform Heap Sort</div>
        <ul class="tree" id="tree">
            <li>
                <span>1</span>
                <ul></ul>
            </li>
        </ul>
    </div>
</div>

<!-- Script for adding functionality to the tree -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Function to save tree structure to localStorage
        function saveTree() {
            localStorage.setItem(
                "heapTree",
                JSON.stringify(document.getElementById("tree").innerHTML)
            );
        }

        // Function to load tree structure from localStorage
        function loadTree() {
            const savedTree = localStorage.getItem("heapTree");
            if (savedTree) {
                document.getElementById("tree").innerHTML = JSON.parse(savedTree);
            }
        }

        // Load saved tree structure on page load
        loadTree();

        // Function to perform heap sort
        function heapSort() {
            // Get all tree nodes
            const treeNodes = document.querySelectorAll(".tree span, .pri");
            const arr = [];
            treeNodes.forEach((node) => {
                arr.push(parseInt(node.textContent.trim()));
            });

            // Build a min heap
            buildMinHeap(arr);

            // Extract elements from the min heap one by one
            const sortedArr = [];
            while (arr.length > 0) {
                sortedArr.push(extractMin(arr));
            }

            // Rebuild the tree with the sorted elements
            rebuildBinaryTree(sortedArr);
        }

        // Function to build a min heap
        function buildMinHeap(arr) {
            const n = arr.length;
            for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
                heapify(arr, n, i);
            }
        }

        // Function to heapify a subtree rooted with node i which is an index in arr[]
        function heapify(arr, n, i) {
            let smallest = i;
            const left = 2 * i + 1;
            const right = 2 * i + 2;

            if (left < n && arr[left] < arr[smallest]) {
                smallest = left;
            }

            if (right < n && arr[right] < arr[smallest]) {
                smallest = right;
            }

            if (smallest !== i) {
                [arr[i], arr[smallest]] = [arr[smallest], arr[i]];
                heapify(arr, n, smallest);
            }
        }

        // Function to extract minimum element from the min heap
        function extractMin(arr) {
            const min = arr[0];
            arr[0] = arr[arr.length - 1];
            arr.pop();
            heapify(arr, arr.length, 0);
            return min;
        }

        // Function to rebuild the tree with the sorted elements
       // Function to rebuild the binary tree with the sorted elements
       function rebuildBinaryTree(sortedArr) {
            const treeRoot = document.getElementById("tree");
            treeRoot.innerHTML = ''; // Clear the tree

            // Rebuild the binary tree
            buildBinaryTree(sortedArr, treeRoot);
            console.log(sortedArr);
        }

        // Function to build a binary tree from an array of values
        function buildBinaryTree(arr, parent, index = 0) {
            if (index >= arr.length || arr[index] === null)
                return null;

            const newNode = document.createElement("li");
            const newSpan = document.createElement("span");
            newSpan.textContent = arr[index];
            newNode.appendChild(newSpan);

            if (parent.tagName.toLowerCase() === 'ul') {
                parent.appendChild(newNode);
            } else {
                const ul = document.createElement("ul");
                ul.appendChild(newNode);
                parent.appendChild(ul);
            }

           buildBinaryTree(arr, newNode, 2 * index + 1); // Update index for left child
           buildBinaryTree(arr, newNode, 2 * index + 2); // Update index for right child
        }

        // Function to build a tree from an array of values

        // Add click event listener to "Perform Heap Sort" button
        document.getElementById("heapSortBtn").addEventListener("click", function () {
            heapSort();
        });

        // Add click event listener to each tree node
        const treeNodes = document.querySelectorAll(".tree span, .pri");
        treeNodes.forEach((node) => {
          node.addEventListener("click", function (event) {
            // Remove any existing button groups
            const existingBtnGroups = document.querySelectorAll(".btn-group");
            existingBtnGroups.forEach((group) => group.remove());

            if (event.target.textContent === "1") {
              // Create button group for add option only
              const btnGroup = document.createElement("div");
              btnGroup.classList.add("btn-group");

              // Add button for add option
              const addBtn = document.createElement("button");
              addBtn.classList.add("btn");
              addBtn.textContent = "+";
              addBtn.addEventListener("click", function (e) {
                const childNodes =
                  event.target.parentElement.querySelectorAll("ul");
                const numChildren = childNodes.length;

                if (numChildren === 2) {
                  alert(
                    "This node already has two children. You cannot add more."
                  );
                  return;
                }
                // Add functionality to add button here
                const newNodeName = prompt("Enter the name of the new node:");
                if (newNodeName) {
                  if (isNaN(newNodeName)) {
                    alert("Enter Number only");
                    return;
                  }

                  const newListItem = document.createElement("li");
                  const newSpan = document.createElement("span");
                  newSpan.textContent = newNodeName;
                  newListItem.appendChild(newSpan);

                  let newUl = event.target.nextElementSibling;
                  if (!newUl) {
                    newUl = document.createElement("ul");
                    event.target.parentElement.appendChild(newUl);
                  }

                  newUl.appendChild(newListItem);
                  // Save tree structure after modification
                  saveTree();
                  window.location.reload();
                }
              });

              // Append button to the button group
              btnGroup.appendChild(addBtn);

              // Append button group after the clicked tree node's span element
              event.target.appendChild(btnGroup);

              // Save tree structure after modification
              saveTree();
            } else {
              // Create button group for add, delete, and move options
              const btnGroup = document.createElement("div");
              btnGroup.classList.add("btn-group");

              // Add buttons for add, delete, and move
              const addBtn = document.createElement("button");
              addBtn.classList.add("btn");
              addBtn.textContent = "➕";
              addBtn.addEventListener("click", function () {
                // Add functionality to add button here
                const childNodes =
                  event.target.parentElement.querySelectorAll("li");
                const numChildren = childNodes.length;

                if (numChildren === 2) {
                  alert(
                    "This node already has two children. You cannot add more."
                  );
                  return;
                }
                const newNodeName = prompt("Enter the name of the new node:");
                if (newNodeName) {
                  if (isNaN(newNodeName)) {
                    alert("Enter Number Only");
                    return;
                  }
                  const newListItem = document.createElement("li");
                  const newSpan = document.createElement("span");
                  newSpan.textContent = newNodeName;
                  newListItem.appendChild(newSpan);

                  const newUl = document.createElement("ul");
                  newListItem.appendChild(newUl);

                  // Get the parent ul of the clicked button
                  const parentLi = event.target.parentElement;
                  const parentUl = parentLi.querySelector("ul");

                  if (parentUl) {
                    parentUl.appendChild(newListItem);
                  } else {
                    // If parent ul doesn't exist, create a new one and append the new list item to the parent li
                    const newParentUl = document.createElement("ul");
                    parentLi.appendChild(newParentUl);
                    newParentUl.appendChild(newListItem);
                  }

                  // Save tree structure after modification
                  saveTree();
                  window.location.reload();
                }
              });

              const deleteBtn = document.createElement("button");
              deleteBtn.classList.add("btn");
              deleteBtn.textContent = "➖";
              deleteBtn.addEventListener("click", function () {
                // Add functionality to delete button here
                const parentLi = this.parentElement.parentElement.parentElement;
                console.log(parentLi);

                // Remove the parent <li> element, which contains the <ul> and its children
                parentLi.remove();

                // Save tree structure after modification
                saveTree();
              });

              // Append buttons to the button group
              btnGroup.appendChild(addBtn);
              btnGroup.appendChild(deleteBtn);

              // Append button group after the clicked tree node's span element
              event.target.appendChild(btnGroup);

              // Save tree structure after modification
              saveTree();
            }
          });
        });
   
   });
</script>
</body>
</html>
